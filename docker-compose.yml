services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Single listener inside docker network.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"

  spark-master:
    image: apache/spark:3.5.1
    environment:
      SPARK_NO_DAEMONIZE: "true"
    volumes:
      - .:/app
    ports:
      - "8080:8080"
      - "7077:7077"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077"]

  spark-worker:
    image: apache/spark:3.5.1
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: "4g"
    volumes:
      - .:/app
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--memory", "4g", "spark://spark-master:7077"]

  # Used to run spark-submit jobs against the in-compose Spark master.
  # Built from Dockerfile.spark-client which adds numpy (needed by pyspark.ml / MinHashLSH).
  spark-client:
    build:
      context: .
      dockerfile: Dockerfile.spark-client
    platform: linux/arm64
    user: root
    depends_on:
      - spark-master
      - kafka
    environment:
      SPARK_NO_DAEMONIZE: "true"
    volumes:
      - .:/app
    working_dir: /app

  # Simple python environment to run the Kafka producer script.
  producer-client:
    image: python:3.11-slim
    platform: linux/arm64
    depends_on:
      - kafka
    volumes:
      - .:/app
    working_dir: /app
    entrypoint: ["/bin/sh", "-c"]

